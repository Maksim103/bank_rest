databaseChangeLog:
  - changeSet:
      id: create-block-requests-table
      author: maksim.zhigarev
      changes:
        - createTable:
            tableName: block_requests
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: card_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_block_requests_card
                    referencedTableName: cards
                    referencedColumnNames: id
                    nullable: false
                    onDelete: RESTRICT
                    onUpdate: RESTRICT
              - column:
                  name: requester_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_block_requests_requester
                    referencedTableName: users
                    referencedColumnNames: id
                    nullable: false
                    onDelete: RESTRICT
                    onUpdate: RESTRICT
              - column:
                  name: status
                  type: varchar(15)
                  defaultValue: "PENDING"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
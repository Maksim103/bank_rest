spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3307/bank_rest_DB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    show-sql: true
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour in milliseconds